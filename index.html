<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#b7b3b2">
  <title>Nahar</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root { --cream: #f2ece5; --ink: #1c1917; --muted: #7a716b; --mocha: #5c3f30; --line: #d9d0c6; --grey: #b7b3b2; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--grey); color: var(--ink); font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

    /* Hero */
    video { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; }
    .hero { position: relative; z-index: 1; height: 100vh; height: 100svh; }
    @media (hover: none) { .hero { height: 200vh; height: 200svh; } } /* scroll track: scrolling through it turns her head */
    .stage { position: sticky; top: 0; height: 100vh; height: 100svh; }
    .stage header { position: absolute; top: 0; left: 0; padding: max(16px, env(safe-area-inset-top)) 20px; }
    .stage header a { color: var(--ink); text-decoration: none; font-weight: 500; font-size: 28px; letter-spacing: 0.08em; text-shadow: 0 1px 4px rgba(255,255,255,0.5); }
    .hint { position: absolute; left: 0; right: 0; bottom: calc(22px + env(safe-area-inset-bottom)); margin: 0; text-align: center; font-size: 14px; line-height: 1.5; color: #2a2624; }
    .hint span { display: inline-block; animation: bob 1.6s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(5px); } }
    @media (min-width: 640px) { .stage header { padding: 24px 32px; } .stage header a { font-size: 36px; } }

    /* Questionnaire panel slides over the fixed video */
    main { position: relative; z-index: 2; min-height: 100vh; min-height: 100svh; background: var(--cream); border-radius: 28px 28px 0 0; box-shadow: 0 -12px 40px rgba(0,0,0,0.18); padding: 0 20px calc(64px + env(safe-area-inset-bottom)); }
    .bar { position: sticky; top: 0; z-index: 1; height: 3px; margin: 0 -20px; }
    .bar i { display: block; height: 100%; width: 0; background: var(--mocha); transition: width .5s cubic-bezier(.2,.7,.2,1); }
    .card { max-width: 640px; margin: 0 auto; min-height: calc(100vh - 3px); min-height: calc(100svh - 3px); display: flex; flex-direction: column; justify-content: flex-start; padding: 12vh 0 56px; }
    @media (min-width: 640px) { .card { justify-content: center; padding: 56px 0; } }
    .card.enter { animation: rise .5s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

    .eyebrow { margin: 0 0 14px; font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
    .count { margin: 0 0 10px; font-family: 'Instrument Serif', Georgia, serif; font-size: 22px; color: var(--mocha); }
    .count span { color: var(--muted); font-size: 16px; }
    .q { margin: 0 0 24px; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: clamp(32px, 6vw, 48px); line-height: 1.08; letter-spacing: -0.01em; }
    .lead { margin: 0 0 32px; font-size: 17px; line-height: 1.55; color: #3d3733; }
    .lead a { color: var(--mocha); }
    .still { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; object-position: 50% 30%; border-radius: 18px; margin-bottom: 28px; background: var(--grey); }

    .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    .chip { padding: 10px 18px; border: 1.5px solid var(--line); border-radius: 999px; font-size: 15px; transition: transform .15s, background .2s, color .2s, border-color .2s; }
    .chip:hover { border-color: var(--mocha); }
    .chip:active { transform: scale(0.95); }
    .chip.on { background: var(--mocha); border-color: var(--mocha); color: var(--cream); }

    textarea { display: block; width: 100%; resize: none; overflow: hidden; margin: 0 0 28px; padding: 10px 0 12px; font: inherit; font-size: 19px; line-height: 1.5; color: var(--ink); background: transparent; border: 0; border-bottom: 2px solid var(--line); border-radius: 0; outline: none; transition: border-color .2s; }
    textarea:focus { border-color: var(--mocha); }
    textarea::placeholder { color: #a39a92; }

    .row { display: flex; align-items: center; gap: 18px; }
    .row.end { justify-content: flex-end; }
    .key { margin-left: auto; font-size: 13px; color: var(--muted); }
    @media (hover: none) { .key { display: none; } .row .btn { margin-left: auto; } }
    .btn { padding: 14px 26px; border-radius: 999px; background: var(--mocha); color: var(--cream); font-weight: 500; font-size: 16px; transition: transform .15s, box-shadow .2s; box-shadow: 0 4px 14px rgba(92,63,48,0.25); }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(92,63,48,0.3); }
    .btn:active { transform: scale(0.97); }
    .link { font-size: 15px; color: var(--muted); text-decoration: underline; text-underline-offset: 4px; }
    .link:hover { color: var(--mocha); }

    .review { list-style: none; margin: 0 0 32px; padding: 0; border-top: 1px solid var(--line); }
    .review li { border-bottom: 1px solid var(--line); }
    .review button { display: grid; grid-template-columns: 36px 1fr; gap: 2px 12px; width: 100%; padding: 14px 4px; text-align: left; border-radius: 10px; transition: background .2s; }
    .review button:hover { background: rgba(92,63,48,0.06); }
    .review .n { grid-row: span 2; font-family: 'Instrument Serif', Georgia, serif; font-size: 20px; color: var(--mocha); }
    .review .qt { font-size: 13px; color: var(--muted); line-height: 1.4; }
    .review .at { font-size: 16px; line-height: 1.45; white-space: pre-wrap; }
    .review .at.skip { color: #a39a92; font-style: italic; }

    @media (prefers-reduced-motion: reduce) { .card.enter, .hint span { animation: none; } html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <video id="hero" data-src="hero.mp4" poster="poster.jpg" muted playsinline preload="auto"></video>
  <section class="hero">
    <div class="stage">
      <header><a href="#">NAHAR</a></header>
      <p class="hint">Fifty questions, one at a time.<br>Scroll when you’re ready <span>↓</span></p>
    </div>
  </section>
  <main id="quiz">
    <div class="bar"><i id="progress"></i></div>
    <div id="card" class="card"></div>
  </main>
  <script src="questions.js"></script>
  <script src="app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.js"></script>
</body>
</html>
